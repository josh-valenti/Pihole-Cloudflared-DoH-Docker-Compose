# Pi-hole + cloudflared (DoH)
#
# Both containers get static IPs on their own bridge network, and pihole's
# upstream points at the cloudflared IP instead of the container name.
# dnsmasq only resolves upstream hostnames once at startup. On boot
# Docker's internal DNS isn't always ready yet - This caused DoH to
# die after a reboot until the stack was bounced. Hardcoding the IP
# sidesteps the whole problem.

services:

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-doh
    restart: unless-stopped
    command: proxy-dns --address 0.0.0.0 --port 5053
    networks:
      dns_net:
        ipv4_address: 172.28.0.2   # pihole's upstream points here
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    # No healthcheck - the image is distroless (no shell/dig) so there's
    # nothing to run. Doesn't matter, FTL just retries the IP until it's up.

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    depends_on:
      - cloudflared
    networks:
      dns_net:
        ipv4_address: 172.28.0.3
    ports:
      - "192.168.0.29:53:53/tcp"
      - "192.168.0.29:53:53/udp"
      - "192.168.0.29:8081:80/tcp"
    environment:
      TZ: "America/Detroit"
      WEB_PORT: "80"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: "172.28.0.2#5053"   # by IP on purpose, see top
    volumes:
      - ./config/pihole:/etc/pihole
      - ./config/dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

# 172.28.x avoids Docker's default 172.17-172.20 pools. Change it if it
# overlaps your LAN/VPN (and update the upstream IP above to match).
networks:
  dns_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
